openapi: 3.0.0
info:
  title: API de Recursos
  description: Documentação interativa da API de Recursos.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Servidor Local

paths:
  /api/recurso:
    get:
      summary: Lista todos os registros
      responses:
        '200':
          description: Lista de registros retornada com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Registro'
    post:
      summary: Cria um novo registro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovoRegistro'
      responses:
        '201':
          description: Registro criado com sucesso.
        '400':
          description: Erro de validação.

  /api/recurso/{id}:
    get:
      summary: Busca um registro pelo ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Registro encontrado.
        '404':
          description: Registro não encontrado.
    put:
      summary: Atualiza um registro existente
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovoRegistro'
      responses:
        '200':
          description: Registro atualizado com sucesso.
        '404':
          description: Registro não encontrado.
    delete:
      summary: Remove um registro pelo ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Registro removido com sucesso.
        '404':
          description: Registro não encontrado.

components:
  schemas:
    Registro:
      type: object
      properties:
        id:
          type: integer
          example: 1693324512345
        titulo:
          type: string
          example: "Meu primeiro recurso"
        status:
          type: string
          example: "ativo"
    NovoRegistro:
      type: object
      required:
        - titulo
      properties:
        titulo:
          type: string
          example: "Meu primeiro recurso"
        status:
          type: string
          example: "ativo"
